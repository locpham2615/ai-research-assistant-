services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: research_assistant_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO

  grobid:
    image: lfoppiano/grobid:0.8.1
    container_name: research_assistant_grobid
    restart: unless-stopped
    ports:
      - "8070:8070"

volumes:
  qdrant_storage: