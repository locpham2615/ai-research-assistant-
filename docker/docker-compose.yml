services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: research_assistant_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP API & Web Dashboard
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO

volumes:
  qdrant_storage: